name: Finite reference verification
on:
  push:
  pull_request:
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install networkx pytest matplotlib pillow
      - name: Exhaustive reference classification
        run: python validation/reference.py --out Data
      - name: Independent tests
        run: pytest -q Tests/test_reference.py
